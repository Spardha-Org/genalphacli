services:
  core:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    env_file: /opt/genalpha/.env
    command: ["uv", "run", "uvicorn", "services.core.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  tps:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    env_file: /opt/genalpha/.env
    command: ["uv", "run", "uvicorn", "services.tps.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    env_file: /opt/genalpha/.env
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/genalpha/repo/infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - core
    restart: unless-stopped
