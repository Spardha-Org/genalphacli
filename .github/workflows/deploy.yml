name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        working-directory: web

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN
        working-directory: web

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: web

  deploy-backend:
    name: Deploy Backend (EC2 #1)
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TPS_SECRET: ${{ secrets.TPS_SECRET }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      MAGIC_LINK_SECRET: ${{ secrets.MAGIC_LINK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FERNET_KEY: ${{ secrets.FERNET_KEY }}
      RDS_HOST: ${{ secrets.RDS_HOST }}
      TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_ADDRESS }}
      VERCEL_URL: ${{ secrets.VERCEL_URL }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BACKEND_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,TPS_SECRET,WORKER_SECRET,MAGIC_LINK_SECRET,RESEND_API_KEY,FERNET_KEY,RDS_HOST,TEMPORAL_ADDRESS,VERCEL_URL,OAUTH_CLIENT_ID,OAUTH_CLIENT_SECRET
          script: |
            sudo tee /opt/genalpha/.env > /dev/null << ENVEOF
            # Core
            CORE_DATABASE__URL=postgresql+asyncpg://genalpha:${DB_PASSWORD}@${RDS_HOST}:5432/core
            CORE_AUTH__MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET}
            CORE_AUTH__SESSION_COOKIE_SECURE=false
            CORE_TPS__URL=http://tps:8001
            CORE_TPS__SECRET=${TPS_SECRET}
            CORE_WORKER__SECRET=${WORKER_SECRET}
            CORE_APP_URL=${VERCEL_URL}
            CORE_TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
            CORE_EMAIL__RESEND_API_KEY=${RESEND_API_KEY}
            CORE_EMAIL__FROM_ADDRESS=GenAlpha <noreply@contact.boot41.online>

            # TPS
            TPS_DATABASE_URL=postgresql+asyncpg://genalpha:${DB_PASSWORD}@${RDS_HOST}:5432/tps
            TPS_TPS_SECRET=${TPS_SECRET}
            TPS_FERNET_KEYS=${FERNET_KEY}
            TPS_GITHUB_CLIENT_ID=${OAUTH_CLIENT_ID}
            TPS_GITHUB_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
            TPS_GITHUB_REDIRECT_URI=${VERCEL_URL}/api/oauth/callback

            # Worker
            CORE_URL=http://core:8000
            TPS_URL=http://tps:8001
            TPS_SECRET=${TPS_SECRET}
            WORKER_SECRET=${WORKER_SECRET}
            TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
            ENVEOF

            # Pull and deploy
            cd /opt/genalpha/repo
            sudo git pull origin main
            sudo docker-compose -f infra/compose/docker-compose.backend.yml --env-file /opt/genalpha/.env down
            sudo docker-compose -f infra/compose/docker-compose.backend.yml --env-file /opt/genalpha/.env up -d --build

            # Run migrations
            sudo docker exec compose-core-1 bash -c 'PYTHONPATH=.:src uv run alembic -c services/core/alembic.ini upgrade head' || true
            sudo docker exec compose-core-1 bash -c 'PYTHONPATH=.:src uv run alembic upgrade head' || true

            echo "Backend deployed at $(date)"

  deploy-infra:
    name: Deploy Infra (EC2 #2)
    runs-on: ubuntu-latest
    env:
      TEMPORAL_UI_USER: ${{ secrets.TEMPORAL_UI_USER }}
      TEMPORAL_UI_PASS: ${{ secrets.TEMPORAL_UI_PASS }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFRA_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TEMPORAL_UI_USER,TEMPORAL_UI_PASS
          script: |
            cd /opt/genalpha/repo
            sudo git pull origin main
            sudo docker-compose -f infra/compose/docker-compose.infra.yml pull
            sudo docker-compose -f infra/compose/docker-compose.infra.yml up -d

            # Set up Temporal UI basic auth via Nginx
            sudo yum install -y nginx httpd-tools 2>/dev/null
            echo -n "${TEMPORAL_UI_USER}:" | sudo tee /etc/nginx/.htpasswd > /dev/null
            echo "${TEMPORAL_UI_PASS}" | openssl passwd -stdin -apr1 | sudo tee -a /etc/nginx/.htpasswd > /dev/null

            sudo tee /etc/nginx/conf.d/temporal.conf > /dev/null << 'NGEOF'
            server {
                listen 8081;
                server_name _;
                auth_basic "Temporal UI";
                auth_basic_user_file /etc/nginx/.htpasswd;
                location / {
                    proxy_pass http://localhost:8080;
                }
            }
            NGEOF

            sudo systemctl enable nginx
            sudo systemctl restart nginx
            echo "Infra deployed at $(date)"
